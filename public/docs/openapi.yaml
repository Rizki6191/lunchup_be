                  description: ''
                  example: null
                email:
                  type: string
                  description: ''
                  example: null
                current_password:
                  type: string
                  description: 'This field is required when <code>password</code> is present.'
                  example: null
                password:
                  type: string
                  description: 'Must be at least 8 characters.'
